<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>中橋季刊 2026冬季號（測試發布）</title>
<style>
  :root {
    --maple-red: #BA181B;
    --amber-gold: #D4A373;
    --parchment: #FAF8F5;
    --walnut: #2B231F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(160deg, #2b231f 0%, #3d2f27 100%);
    color: var(--parchment);
    font-family: "Noto Serif TC", "Songti TC", "Yu Mincho", Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; padding: 1.4rem 1rem 0.6rem; }
  header h1 { margin: 0; color: var(--amber-gold); font-size: 1.4rem; letter-spacing: 0.06em; }
  header p { margin: 0.3rem 0 0; opacity: 0.75; font-size: 0.85rem; }

  #stage {
    perspective: 2400px;
    width: min(92vw, 1000px);
    aspect-ratio: 1.55 / 1;
    margin: 1.2rem 0;
    position: relative;
  }
  #book {
    width: 100%; height: 100%;
    display: flex;
    box-shadow: 0 18px 55px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.05) inset;
    border-radius: 4px;
    overflow: hidden;
    background: #111;
  }
  .page {
    flex: 1 1 50%;
    background: #fff center/contain no-repeat;
    position: relative;
  }
  .page.left { border-right: 1px solid rgba(0,0,0,0.15); box-shadow: inset -14px 0 24px -18px rgba(0,0,0,0.45); }
  .page.right { box-shadow: inset 14px 0 24px -18px rgba(0,0,0,0.45); }
  .page img { width: 100%; height: 100%; object-fit: contain; display: block; }

  #book.flipping { animation: flip 0.5s ease-in-out; }
  @keyframes flip {
    0%   { transform: rotateY(0deg); }
    50%  { transform: rotateY(6deg) scale(0.98); filter: brightness(0.85); }
    100% { transform: rotateY(0deg); }
  }

  #controls { display: flex; align-items: center; gap: 1.2rem; padding-bottom: 2rem; }
  button {
    background: linear-gradient(135deg, var(--maple-red) 0%, var(--amber-gold) 130%);
    color: #fff; border: none; border-radius: 999px;
    width: 46px; height: 46px; font-size: 1.2rem; cursor: pointer;
    box-shadow: 0 4px 14px rgba(186,24,27,0.35);
  }
  button:disabled { opacity: 0.35; cursor: default; }
  #pageInfo { min-width: 6em; text-align: center; opacity: 0.85; font-size: 0.9rem; }
  #loading { opacity: 0.7; padding: 3rem 1rem; text-align: center; }
  a.pdf-link { color: var(--amber-gold); }
</style>
</head>
<body>
  <header>
    <h1>🍁 中橋季刊 2026冬季號（測試發布）</h1>
    <p>中橋季刊 · 3D 翻頁電子期刊 —— 點兩側箭頭翻頁，或直接
      <a class="pdf-link" href="magazine.pdf" target="_blank" rel="noopener">下載 PDF</a>
    </p>
  </header>

  <div id="loading">電子書載入中…</div>
  <div id="stage" style="display:none">
    <div id="book">
      <div class="page left"><img id="imgLeft" alt="" /></div>
      <div class="page right"><img id="imgRight" alt="" /></div>
    </div>
  </div>
  <div id="controls" style="display:none">
    <button id="prevBtn" aria-label="上一頁">‹</button>
    <span id="pageInfo">- / -</span>
    <button id="nextBtn" aria-label="下一頁">›</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const PDF_URL = "magazine.pdf";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pdfDoc = null;
    let spread = 0; // 0 = 封面單頁, 之後每次 +2
    const pageCache = {};

    async function renderPage(num) {
      if (pageCache[num]) return pageCache[num];
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: 2 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      const url = canvas.toDataURL("image/jpeg", 0.85);
      pageCache[num] = url;
      return url;
    }

    function totalSpreads() {
      return Math.ceil((pdfDoc.numPages - 1) / 2) + 1;
    }

    async function showSpread(s) {
      const book = document.getElementById("book");
      book.classList.add("flipping");
      setTimeout(() => book.classList.remove("flipping"), 500);

      const imgLeft = document.getElementById("imgLeft");
      const imgRight = document.getElementById("imgRight");
      if (s === 0) {
        imgLeft.src = "";
        imgLeft.style.visibility = "hidden";
        imgRight.style.visibility = "visible";
        imgRight.src = await renderPage(1);
      } else {
        const leftNum = 2 * s;
        const rightNum = 2 * s + 1;
        imgLeft.style.visibility = "visible";
        imgLeft.src = leftNum <= pdfDoc.numPages ? await renderPage(leftNum) : "";
        imgRight.style.visibility = rightNum <= pdfDoc.numPages ? "visible" : "hidden";
        imgRight.src = rightNum <= pdfDoc.numPages ? await renderPage(rightNum) : "";
      }
      document.getElementById("pageInfo").textContent =
        `第 ${s === 0 ? 1 : 2 * s} 頁 / 共 ${pdfDoc.numPages} 頁`;
      document.getElementById("prevBtn").disabled = s === 0;
      document.getElementById("nextBtn").disabled = s >= totalSpreads() - 1;
    }

    async function init() {
      try {
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        document.getElementById("loading").style.display = "none";
        document.getElementById("stage").style.display = "block";
        document.getElementById("controls").style.display = "flex";
        await showSpread(0);
      } catch (err) {
        document.getElementById("loading").textContent = "電子書載入失敗：" + err;
      }
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (spread > 0) { spread--; showSpread(spread); }
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (spread < totalSpreads() - 1) { spread++; showSpread(spread); }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();
      if (e.key === "ArrowRight") document.getElementById("nextBtn").click();
    });

    init();
  </script>
</body>
</html>
